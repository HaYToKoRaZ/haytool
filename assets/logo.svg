<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="ht-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="ht-grad-stream" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="ht-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Subtle Ring -->
  <circle cx="24" cy="24" r="21" stroke="#3B82F6" stroke-width="1.2" stroke-opacity="0.25" stroke-dasharray="3 3" />
  
  <!-- Left Pillar of H -->
  <path d="M14 10 L18 10 L18 38 L14 38 Z" fill="url(#ht-grad-1)" rx="1" />
  <path d="M14 10 L18 14 L18 20 L14 16 Z" fill="#00E5FF" fill-opacity="0.6" />
  
  <!-- Right Pillar of H -->
  <path d="M30 10 L34 10 L34 38 L30 38 Z" fill="url(#ht-grad-1)" rx="1" />
  <path d="M30 28 L34 32 L34 38 L30 38 Z" fill="#6366F1" fill-opacity="0.6" />

  <!-- Flowing Dynamic Bridge Wave (Omnichannel stream across H) -->
  <path d="M8 27 C 13 27, 15 22, 24 22 C 33 22, 35 17, 40 17" stroke="url(#ht-grad-stream)" stroke-width="3" stroke-linecap="round" fill="none" filter="url(#ht-glow)" />
  <path d="M8 30 C 13 30, 15 25, 24 25 C 33 25, 35 20, 40 20" stroke="#00E5FF" stroke-width="1.5" stroke-linecap="round" fill="none" />
  
  <!-- Central Connectivity Node -->
  <circle cx="24" cy="23.5" r="2" fill="#FFFFFF" />
  <circle cx="24" cy="23.5" r="3.5" stroke="#00E5FF" stroke-width="1" fill="none" opacity="0.8" />
</svg>
